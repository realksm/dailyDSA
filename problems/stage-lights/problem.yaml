title: Stage Lights
kind: track
memory_mb: 256
samples: 2
tests: 14
input:
  vars:
    - { name: n, type: int }
    - { name: q, type: int }
    - { name: cmds, type: "int[][]", rows: q, cols: 3 }
  returns: "long[]"
  join: spaces
hints:
  - >-
    Don't touch every lamp of every command. A command only changes the brightness *difference*
    between neighbouring lamps at the two edges of its range: lamp `l` gets `v` more than lamp
    `l - 1`, and lamp `r + 1` gets `v` less than lamp `r`.
  - >-
    Keep a difference array `diff` of size `n + 1`, where `diff[i]` is how much brighter lamp `i`
    is than lamp `i - 1` (0-based, with lamp `-1` at 0).
  - >-
    For each command, `diff[l - 1] += v` and `diff[r] -= v`. After all commands, a running sum
    over `diff` gives the lamps' final brightness from left to right. That's O(n + q) instead of
    O(n * q). Use 64-bit sums.
