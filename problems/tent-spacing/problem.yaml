title: Tent Spacing
kind: track
memory_mb: 256
samples: 2
tests: 14
input:
  vars:
    - { name: n, type: int }
    - { name: k, type: int }
    - { name: spot, type: "long[]", length: n }
  returns: long
hints:
  - >-
    Turn the question around: "can `k` tents all be at least `D` metres apart?" If that works
    for some `D`, it also works for every smaller `D`. So binary search for the largest `D` that
    works.
  - >-
    Sort the spots. To check one `D`, walk through the spots from left to right, keeping the
    position of the last tent you pitched and how many tents you have pitched.
  - >-
    Greedy check: pitch the first tent on the leftmost spot, then pitch one on every spot that is
    at least `D` past the last tent. Taking the earliest spot that fits never hurts, because it
    leaves the most room for the rest. `D` works if this pitches at least `k` tents. Search `D`
    between 1 and `max - min`.
